<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131922">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capable">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Capable: Learning Roadmap Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --raised: #f5f7fa; --line: #d9dfe7; --line-soft: #e7ebf0;
  --text: #17202b; --muted: #5b6776; --faint: #8a95a3;
  --green: #1f9d63; --yellow: #b7860f; --red: #cf4a3f; --blue: #2f7fd6; --purple: #7a5ae0; --teal: #178f8a;
  --green-bg: #e3f5ec; --yellow-bg: #fbf1d8; --red-bg: #fbe6e3; --blue-bg: #e3eefb; --purple-bg: #eee8fc; --teal-bg: #dff3f1; --muted-bg: #edf0f3;
  --ink: #17202b; --focus: #2f7fd6;
  --radius-lg: 14px; --radius: 9px; --radius-sm: 6px;
  --font: 'Onest', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131922; --surface: #1a212c; --raised: #212a37; --line: #2c3645; --line-soft: #252e3b;
    --text: #e4e9f0; --muted: #98a3b3; --faint: #6d7988;
    --green: #4cc38a; --yellow: #e3b64c; --red: #ea6c62; --blue: #65a9f2; --purple: #a891f3; --teal: #45bdb5;
    --green-bg: #173427; --yellow-bg: #362e17; --red-bg: #3a1f1d; --blue-bg: #172b42; --purple-bg: #2a2342; --teal-bg: #133331; --muted-bg: #252e3b;
    --ink: #e4e9f0; --focus: #65a9f2;
  }
}
:root[data-theme="dark"] {
  --bg: #131922; --surface: #1a212c; --raised: #212a37; --line: #2c3645; --line-soft: #252e3b;
  --text: #e4e9f0; --muted: #98a3b3; --faint: #6d7988;
  --green: #4cc38a; --yellow: #e3b64c; --red: #ea6c62; --blue: #65a9f2; --purple: #a891f3; --teal: #45bdb5;
  --green-bg: #173427; --yellow-bg: #362e17; --red-bg: #3a1f1d; --blue-bg: #172b42; --purple-bg: #2a2342; --teal-bg: #133331; --muted-bg: #252e3b;
  --ink: #e4e9f0; --focus: #65a9f2;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 15px; }
.brand-name { font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
.nav a:hover { background: var(--raised); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--text); box-shadow: inset 2px 0 0 var(--text); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav-group { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; }
.side-foot { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line-soft); }
.main { min-width: 0; padding: 26px 32px 60px; max-width: 1360px; }
.topbar { display: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- layout ---------- */
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.span-2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 16px; } .mt-s { margin-top: 8px; } .mb { margin-bottom: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px; min-width: 0; }
.card.flat { background: var(--raised); border-color: var(--line-soft); border-radius: var(--radius); }
.card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.card h2 .sub { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.big { font-size: 34px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; }
.mid { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.divider { height: 1px; background: var(--line-soft); margin: 14px 0; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- hero (dashboard) ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.today-topic { font-size: 30px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; margin: 6px 0 2px; }
.today-meta { color: var(--muted); font-size: 14px; }
.type-band { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; }
.exam-card { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.exam-title { font-size: 28px; font-weight: 700; letter-spacing: 0.01em; color: var(--red); }

/* pipeline — signature element */
.pipe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
.pipe-stage { position: relative; background: var(--raised); padding: 12px 12px 10px; min-width: 0; }
.pipe-stage:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.pipe-stage:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.pipe-stage .nm { font-size: 12px; color: var(--muted); }
.pipe-stage .vl { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.pipe-fill { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 2px; }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.vs-num { font-size: 40px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
.vs-lab { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* ---------- atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; line-height: 1.5; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.t-green { color: var(--green); } .t-yellow { color: var(--yellow); } .t-red { color: var(--red); } .t-blue { color: var(--blue); } .t-purple { color: var(--purple); } .t-teal { color: var(--teal); } .t-muted { color: var(--muted); }
.bg-green { background: var(--green-bg); color: var(--green); } .bg-yellow { background: var(--yellow-bg); color: var(--yellow); } .bg-red { background: var(--red-bg); color: var(--red); }
.bg-blue { background: var(--blue-bg); color: var(--blue); } .bg-purple { background: var(--purple-bg); color: var(--purple); } .bg-teal { background: var(--teal-bg); color: var(--teal); } .bg-muted { background: var(--muted-bg); color: var(--muted); }
.fill-green { background: var(--green); } .fill-yellow { background: var(--yellow); } .fill-red { background: var(--red); } .fill-blue { background: var(--blue); } .fill-purple { background: var(--purple); } .fill-teal { background: var(--teal); } .fill-muted { background: var(--faint); }

.bar { height: 8px; background: var(--raised); border-radius: 99px; overflow: hidden; position: relative; }
.bar.thin { height: 5px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
.bar > i.ghost { opacity: .35; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 48px; align-items: center; gap: 12px; font-size: 13px; padding: 5px 0; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .v { text-align: right; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-size: 13px; }

.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.checks li:last-child { border-bottom: 0; }
.checks li.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.cb { appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--faint); border-radius: 5px; flex: none; margin-top: 2px; cursor: pointer; display: grid; place-items: center; background: var(--surface); }
.cb:checked { background: var(--green); border-color: var(--green); }
.cb:checked::after { content: ''; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kv > div { background: var(--raised); border-radius: var(--radius); padding: 10px 12px; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

.score-parts { display: grid; gap: 9px; }
.sp { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.sp .v { text-align: right; font-weight: 600; }
.sp-why { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
.flag { font-size: 13px; padding: 9px 12px; border-radius: var(--radius); background: var(--yellow-bg); color: var(--text); border-left: 3px solid var(--yellow); }
.flag.blue { background: var(--blue-bg); border-left-color: var(--blue); }
.flag.green { background: var(--green-bg); border-left-color: var(--green); }
.flag.red { background: var(--red-bg); border-left-color: var(--red); }

.advisor ol { margin: 8px 0 0; padding-left: 20px; }
.advisor li { padding: 3px 0; }
.advisor .rec { margin-top: 12px; padding: 12px 14px; background: var(--raised); border-radius: var(--radius); font-size: 14px; }

/* ---------- forms ---------- */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); }
label.f.inline { flex-direction: row; align-items: center; gap: 10px; color: var(--text); font-size: 14px; font-weight: 400; cursor: pointer; }
.in, select.in, textarea.in { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px; color: var(--text); }
textarea.in { min-height: 72px; resize: vertical; line-height: 1.45; }
.in:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.hours { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.hours .in { text-align: center; font-size: 17px; font-weight: 600; padding: 8px 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--surface); }
.range-wrap { display: flex; align-items: center; gap: 12px; }
.range-wrap input[type=range] { flex: 1; accent-color: var(--text); }
.range-wrap output { font-weight: 650; font-size: 18px; width: 34px; text-align: right; }
.highlight-field { border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: var(--radius); padding: 12px 14px; background: var(--raised); }
.sticky { position: sticky; top: 16px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--raised); }
table.t tr.sel td { background: var(--raised); }
.mini-bar { display: inline-block; width: 56px; height: 5px; background: var(--raised); border-radius: 9px; vertical-align: middle; margin-right: 8px; position: relative; overflow: hidden; }
.mini-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; }
.cat-stripe { display: inline-block; width: 3px; height: 16px; border-radius: 2px; vertical-align: middle; margin-right: 10px; }

/* ---------- roadmap timeline ---------- */
.phase { margin-bottom: 26px; }
.phase-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.phase-head h2 { margin: 0; font-size: 18px; font-weight: 650; }
.tl { position: relative; padding-left: 22px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
.tl-item { position: relative; display: grid; grid-template-columns: 140px minmax(0, 1fr) 190px 110px; gap: 14px; align-items: center; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 4px; cursor: default; }
.tl-item.click { cursor: pointer; }
.tl-item.click:hover { background: var(--surface); }
.tl-item::before { content: ''; position: absolute; left: -20px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); }
.tl-item.now { background: var(--surface); border: 1px solid var(--line); }
.tl-item.now::before { border-color: var(--text); background: var(--text); }
.tl-item.exam { background: var(--red-bg); }
.tl-item.exam::before { border-color: var(--red); }
.tl-item .date { font-size: 13px; color: var(--muted); }
.tl-item .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
.dual { display: grid; gap: 4px; }
.dual .lbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-h { font-size: 12px; color: var(--muted); padding: 0 6px 4px; }
.cal-d { min-height: 96px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; text-align: left; overflow: hidden; }
.cal-d:hover { border-color: var(--faint); }
.cal-d.out { opacity: .35; }
.cal-d.is-today { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.cal-d .n { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.cal-d .lab { font-size: 11.5px; line-height: 1.3; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cal-d .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.cal-d.exam { background: var(--red-bg); border-color: transparent; }
.cal-d.rest { background: var(--raised); }
.cal-icons { display: flex; gap: 4px; margin-top: auto; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- projects ---------- */
.proj-ms { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 14px; }
.proj-ms label { display: flex; align-items: center; gap: 9px; font-size: 14px; padding: 5px 0; cursor: pointer; }
.proj-ms label.done { color: var(--muted); }
.evidence { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ev { background: var(--raised); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
.ev.ok { background: var(--green-bg); }

/* ---------- charts ---------- */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid-line { stroke: var(--line-soft); stroke-width: 1; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- modal + toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 12, 18, .55); display: grid; place-items: center; z-index: 50; padding: 20px; animation: fade .15s ease; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); width: min(640px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 22px 24px; animation: rise .2s cubic-bezier(.2,.7,.2,1); }
.modal.wide { width: min(820px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.modal-head h2 { margin: 0; font-size: 19px; font-weight: 650; }
.x { border: 0; background: var(--raised); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); flex: none; }
.q-block { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.q-block:last-of-type { border-bottom: 0; }
.q-kind { font-size: 12px; color: var(--muted); }
.q-text { margin: 2px 0 8px; font-weight: 500; }
.toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--radius); font-size: 14px; max-width: 360px; animation: rise .2s ease; }
.toast.warn { background: var(--yellow); color: #1b1405; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.view-enter { animation: fade .18s ease; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl-item { grid-template-columns: 120px minmax(0, 1fr) 150px; }
  .tl-item .st { display: none; }
}
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; padding-top: calc(22px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; }

/* =========================================================
   2. STORAGE LAYER
   Everything reads/writes through Repo. To move to Supabase,

   table (or split `logs`, `checks`, `revisions`, `projects`
   into their own tables keyed by user_id + date / id).
   ========================================================= */
const StorageAdapter = {
  key: 'learning-roadmap-tracker:v1',
  memory: null,
  load() {
    try { const raw = localStorage.getItem(this.key); if (raw) return JSON.parse(raw); } catch (e) { /* fall through */ }
    return this.memory;
  },
  save(state) {
    this.memory = state;
    try { localStorage.setItem(this.key, JSON.stringify(state)); return true; } catch (e) { return false; }
  },
  clear() { this.memory = null; try { localStorage.removeItem(this.key); } catch (e) {} },
};

function defaultState() {
  return {
    version: 1,
    settings: { theme: 'dark', codingTarget: 2, dateOverride: '' },
    logs: {},          // date -> check-in
    taskChecks: {},    // date -> {taskText: true}
    customTasks: {},   // date -> [text]
    overrides: {},     // date -> {type:'learn', topicId}  (rest day converted)
    checks: {},        // topicId -> [{date, concept, practical, recall, build, decision}]
    topicState: {},    // topicId -> {courseDone, completedOn, essentials}
    revisions: [],     // {id, topicId, interval, due, done, doneOn, result, score, moved}
    projects: seedProjects(),
    weekly: {},        // weekStart -> answers
    monthly: {},       // yyyy-mm -> notes
  };
}

const Repo = {
  state: null,
  init() {
    const loaded = StorageAdapter.load();
    const base = defaultState();
    this.state = loaded ? Object.assign(base, loaded, { settings: Object.assign(base.settings, loaded.settings || {}) }) : base;
  },
  commit() { const ok = StorageAdapter.save(this.state); if (!ok) toast('Could not save to browser storage. Export your data from Settings to keep a copy.', 'warn'); },
  reset() { StorageAdapter.clear(); this.state = defaultState(); this.commit(); },
};
/* =========================================================

   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmt = (s, opts = {}) => { const d = fromISO(s); return `${opts.wd ? WD[d.getDay()] + ', ' : ''}${MONTHS[d.getMonth()].slice(0, opts.long ? 20 : 3)} ${d.getDate()}${opts.year ? ', ' + d.getFullYear() : ''}`; };
const weekStart = s => { const d = fromISO(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return toISO(d); };
const today = () => (S().settings.dateOverride || toISO(new Date()));
const S = () => Repo.state;
const num = v => (isFinite(parseFloat(v)) ? parseFloat(v) : 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = arr => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
const r1 = v => Math.round(v * 10) / 10;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =========================================================

const BASE_DAYS = {};
(function buildSchedule() {
  const counter = {};
  for (const [start, end, type, topicId, label] of SEGMENTS) {
    for (let d = start; d <= end; d = addDays(d, 1)) {
      const info = { date: d, type, topicId: topicId || null, label: label || null };
      if (type === 'learn') { counter[topicId] = (counter[topicId] || 0) + 1; info.dayIdx = counter[topicId]; info.dayCount = TOPIC[topicId].days; }
      BASE_DAYS[d] = info;
    }
  }
})();
const isExam = d => EXAM_PERIODS.some(p => d >= p.start && d <= p.end);
const examFor = d => EXAM_PERIODS.find(p => d >= p.start && d <= p.end);

function dayInfo(d) {
  const base = BASE_DAYS[d];

  return base;
}
const phaseFor = d => PHASES.find(p => d >= p.start && d <= p.end) || (d < ROADMAP_START ? null : PHASES[2]);
const TYPE_LABEL = { learn: 'Learning', rest: 'Rest', project: 'Project', exam: 'University exams', pre: 'Before start' };

      list = tasks.slice((info.dayIdx - 1) * per, info.dayIdx * per);

    }
    list = list.concat(['Write notes in your own words', 'Code without a tutorial']);
  } else if (info.type === 'project') list = PROJECT_DAY_TASKS.slice();
  else if (info.type === 'rest') list = REST_TASKS.slice();
  else if (info.type === 'exam') list = EXAM_TASKS.slice();

}

/* =========================================================
   5. DAILY LEARNING QUALITY SCORE (out of 100)
   ========================================================= */
function scoreLog(log) {
  if (!log) return null;
  const tgt = num(S().settings.codingTarget) || 2;
  const learned = (log.learned || '').trim().length;
  const built = (log.built || '').trim().length;
  const reasons = {};

  let u = (num(log.understanding) / 10) * 25;
  reasons.understanding = `Self-rated understanding ${num(log.understanding) || 0}/10`;
  if (learned < 20) { u *= 0.7; reasons.understanding += '; “What I learned” is too short to back it up (−30%)'; }

  let c = Math.min(num(log.coding) / tgt, 1) * 30;
  reasons.coding = `${num(log.coding)}h of your ${tgt}h coding target`;
  if (num(log.coding) > 0 && !log.selfCoded) { c *= 0.5; reasons.coding += '; code not marked as written by you (−50%)'; }

  let p = (log.noTutorial ? 12 : 0) + (built >= 15 ? 8 : built > 0 ? 4 : 0);
  reasons.practice = `${log.noTutorial ? 'Worked without a tutorial' : 'No tutorial-free work'}; ${built >= 15 ? 'described what you built' : built > 0 ? 'build description is thin' : 'nothing built logged'}`;

  const revDone = S().revisions.some(r => r.doneOn === log.date);
  let r = revDone ? 10 : Math.min(num(log.revision) / 0.5, 1) * 7 + (log.reviewed ? 3 : 0);
  reasons.revision = revDone ? 'Completed a spaced-revision checkpoint' : `${num(log.revision)}h revision${log.reviewed ? '; reviewed earlier material' : ''}`;

  let a = Math.min(num(log.project) / 1, 1) * 10 + (log.applied ? 5 : 0);
  reasons.application = `${num(log.project)}h project work${log.applied ? '; applied it to something practical' : ''}`;

  const parts = { understanding: Math.round(u), coding: Math.round(c), practice: Math.round(p), revision: Math.round(r), application: Math.round(a) };
  const total = Object.values(parts).reduce((x, y) => x + y, 0);
  const flags = [];
  if (num(log.study) >= 2 && num(log.coding) < 0.5) flags.push('Mostly passive study today. Watching hours alone do not raise this score.');
  if (built === 0 && num(log.study) + num(log.coding) > 0) flags.push('Nothing built was logged. Even 20 lines written from memory count.');
  return { total, parts, reasons, flags };
}
const SCORE_MAX = { understanding: 25, coding: 30, practice: 20, revision: 10, application: 15 };
const SCORE_LABEL = { understanding: 'Understanding', coding: 'Coding', practice: 'Practice', revision: 'Revision', application: 'Application' };

const workHours = l => (l ? num(l.study) + num(l.coding) + num(l.project) + num(l.revision) : 0);
const loadHours = l => workHours(l) + (l ? num(l.university) : 0);
const credit = l => (l && l.topicId && TOPIC[l.topicId] ? ({ yes: 1, partial: 0.5 }[l.targetDone] || 0) : 0);

/* =========================================================
   6. DAY STATUS, STREAKS, REST, BURNOUT
   ========================================================= */
function dayStatus(d) {
  const t = today();
  const info = dayInfo(d);
  const log = S().logs[d];
  if (info.type === 'pre') return 'pre';
  if (d > t) return 'future';
  if (info.type === 'exam') return log && num(log.university) > 0 ? 'exam-logged' : 'exam';
  if (info.type === 'rest') return log && workHours(log) >= 3 ? 'completed' : 'rest';
  if (!log) return d < t ? 'missed' : 'pending';
  const sc = scoreLog(log).total;
  if (workHours(log) < 1 && num(log.rest) >= 3) return 'rest-taken';
  if (sc >= 40 || log.targetDone === 'yes') return 'completed';
  return 'partial';
}
// exam days pause the streak (neither add nor break); rest adds.
const STREAK_ADD = new Set(['completed', 'rest', 'rest-taken']);
const STREAK_PAUSE = new Set(['exam', 'exam-logged', 'pending']);

function streaks() {
  const t = today();
  let cur = 0, longest = 0, run = 0;
  for (let d = ROADMAP_START; d <= t; d = addDays(d, 1)) {
    const st = dayStatus(d);
    if (STREAK_ADD.has(st)) { run++; longest = Math.max(longest, run); }
    else if (!STREAK_PAUSE.has(st)) run = 0;
  }
  cur = run;
  return { current: cur, longest };
}

function restStats(upTo = today()) {
  let planned = 0, taken = 0, plannedTaken = 0;
  for (let d = ROADMAP_START; d <= upTo; d = addDays(d, 1)) {
    const info = dayInfo(d), log = S().logs[d];
    if (info.type === 'rest') { planned++; if (!log || workHours(log) < 2) { taken++; plannedTaken++; } }
    else if (info.type !== 'exam' && log && workHours(log) < 1 && num(log.rest) >= 3) taken++;
  }
  return { planned, taken, plannedTaken };
}

function burnout() {
  const t = today();
  let d = S().logs[t] ? t : addDays(t, -1);
  let heavy = 0;
  for (let i = 0; i < 14; i++, d = addDays(d, -1)) { if (loadHours(S().logs[d]) >= 6) heavy++; else break; }
  let sinceRest = 0; d = t;
  for (let i = 0; i < 30 && d >= ROADMAP_START; i++, d = addDays(d, -1)) {
    const info = dayInfo(d), log = S().logs[d];
    const rested = (info.type === 'rest' && workHours(log) < 2) || (log && workHours(log) < 1.5 && d < t) || num(log && log.rest) >= 4;
    if (rested) break; sinceRest++;
  }
  return { heavy, sinceRest, warn: heavy >= 4 || sinceRest >= 14 };
}

/* =========================================================
   7. TOPIC METRICS: course completion vs skill mastery
   ========================================================= */
const CHECK_VAL = { yes: 10, some: 6, help: 6, no: 2 };
function combine(pairs) {
  const valid = pairs.filter(([v]) => v !== null && v !== undefined && !isNaN(v));
  if (!valid.length) return null;
  const w = valid.reduce((a, [, x]) => a + x, 0);
  return valid.reduce((a, [v, x]) => a + v * x, 0) / w;
}
function effDays(tid) { const t = TOPIC[tid], ts = S().topicState[tid] || {}; return ts.essentials ? Math.max(1, Math.ceil(t.days * 0.7)) : t.days; }
function projectProgress(p) { return p.milestones.length ? Math.round(p.milestones.filter(m => m.done).length / p.milestones.length * 100) : 0; }

const _mcache = {};
function clearMetricCache() { for (const k in _mcache) delete _mcache[k]; }
function topicMetrics(tid) {
  if (_mcache[tid]) return _mcache[tid];
  const t = TOPIC[tid];
  const ts = S().topicState[tid] || {};
  const logs = Object.values(S().logs).filter(l => l.topicId === tid);
  const tgt = num(S().settings.codingTarget) || 2;
  const ed = effDays(tid);
  const credits = logs.reduce((a, l) => a + credit(l), 0);
  const course = ts.courseDone ? 100 : Math.min(100, Math.round(credits / ed * 100));
  const hours = { study: 0, coding: 0, project: 0, revision: 0 };
  logs.forEach(l => { for (const k in hours) hours[k] += num(l[k]); });
  const checks = S().checks[tid] || [];
  const last = checks[checks.length - 1] || null;

  const uLogs = logs.length ? avg(logs.map(l => num(l.understanding))) : null;
  const uCheck = last ? (CHECK_VAL[last.concept] + CHECK_VAL[last.recall]) / 2 : null;
  const revs = S().revisions.filter(r => r.topicId === tid && r.done);
  const retention = revs.length ? avg(revs.map(r => r.score)) / 10 : null;
  const understanding = combine([[uLogs, 0.4], [uCheck, 0.6], [retention, 0.2]]);

  const codingRatio = logs.length ? Math.min(1, hours.coding / (ed * tgt)) * 10 : null;
  const noTut = logs.length ? logs.filter(l => l.noTutorial).length / logs.length * 10 : null;
  const pCheck = last ? CHECK_VAL[last.practical] : null;
  const practical = combine([[codingRatio, 0.3], [noTut, 0.2], [pCheck, 0.5]]);

  const projs = S().projects.filter(p => p.stack.includes(tid));
  const projProg = projs.length ? Math.max(...projs.map(projectProgress)) / 10 : 0;
  const applied = logs.length ? logs.filter(l => l.applied || num(l.project) > 0).length / logs.length * 10 : null;
  const bCheck = last ? CHECK_VAL[last.build] : null;
  const projectUsage = (logs.length || last) ? combine([[projProg, 0.4], [applied, 0.2], [bCheck, 0.4]]) : null;
  const portfolio = projs.length ? Math.max(...projs.map(p => projectProgress(p) > 0 ? (p.repo ? 3 : 0) + (p.readme ? 3 : 0) + (p.deployed ? 2 : 0) + (p.demo ? 2 : 0) : 0)) : 0;

  const started = logs.length > 0 || !!last || !!ts.courseDone;
  let mastery = 0;
  if (started) {
    const U = understanding || 0, P = practical || 0, J = projectUsage || 0;
    if (retention === null) mastery = Math.min(85, (U * 0.3 + P * 0.35 + J * 0.2) / 0.85 * 10);
    else mastery = (U * 0.3 + P * 0.35 + J * 0.2 + retention * 0.15) * 10;
  }
  mastery = Math.round(mastery);

  let status;
  const plannedStart = Object.values(BASE_DAYS).find(d => d.topicId === tid);
  if (!started) status = plannedStart && plannedStart.date <= today() ? 'Not started' : 'Upcoming';
  else if (course >= 80 && mastery < 35) status = 'Weak';
  else if (mastery >= 75 && (practical || 0) >= 7) status = 'Strong';
  else if ((understanding || 0) < 6) status = 'Needs Revision';
  else if ((practical || 0) < 6) status = 'Needs Practice';
  else if ((projectUsage || 0) < 5) status = 'Needs Project';
  else status = 'Developing';

  const m = { tid, t, logs, credits, course, hours, checks, last, decision: last ? last.decision : null, understanding, practical, projectUsage, retention, portfolio, mastery, status, started, completed: !!ts.completedOn, ts, projs, revs };
  _mcache[tid] = m;
  return m;
}
const STATUS_TONE = { 'Strong': 'green', 'Developing': 'blue', 'Needs Revision': 'yellow', 'Needs Practice': 'yellow', 'Needs Project': 'yellow', 'Weak': 'red', 'Not started': 'muted', 'Upcoming': 'muted' };
const level = v => (v === null || v === undefined ? 'Untested' : v >= 7.5 ? 'Strong' : v >= 5 ? 'Medium' : v > 0 ? 'Weak' : 'None');
const LEVEL_TONE = { Strong: 'green', Medium: 'yellow', Weak: 'red', None: 'red', Untested: 'muted' };

function decide(c) {
  const v = { yes: 2, some: 1, help: 1, no: 0 };
  const und = v[c.concept] + v[c.recall], doing = v[c.practical] + v[c.build], tot = und + doing;
  if (tot <= 2) return 'Repeat Topic';
  if (tot >= 7) return 'Continue';
  if (und <= 1) return 'Revise';
  if (doing <= 1) return 'Practice More';

}
const DECISION_TONE = { 'Continue': 'green', 'Revise': 'yellow', 'Practice More': 'yellow', 'Repeat Topic': 'red' };

function completionGate(tid) {
  const m = topicMetrics(tid);
  const why = [];
  if (!m.last) why.push('Take the capability check first.');
  else if (m.decision !== 'Continue') why.push(`Your last check says “${m.decision}”.`);
  if ((m.understanding || 0) < 7) why.push(`Understanding is ${r1(m.understanding || 0)}/10 (needs 7).`);
  if ((m.practical || 0) < 6) why.push(`Practical ability is ${r1(m.practical || 0)}/10 (needs 6).`);

}

function scheduleRevisions(tid, from) {
  if (S().revisions.some(r => r.topicId === tid && typeof r.interval === 'number')) return;
  for (const n of REVISION_INTERVALS) {
    let due = addDays(from, n), moved = false;
    while (isExam(due)) { due = addDays(due, 1); moved = true; }

}

/* =========================================================
   8. ROADMAP HEALTH + CATCH-UP
   ========================================================= */
function health() {
  const t = today();
  const plannedCount = {};
  for (let d = ROADMAP_START; d <= t; d = addDays(d, 1)) {
    const info = dayInfo(d);
    if (info.type !== 'learn') continue;
    if (d === t && !S().logs[t]) continue; // today counts once you check in
    plannedCount[info.topicId] = (plannedCount[info.topicId] || 0) + 1;
  }
  let plannedTotal = 0, actualTotal = 0;
  const rows = [];
  for (const tp of TOPICS) {
    const m = topicMetrics(tp.id), ed = effDays(tp.id);
    const pDays = Math.min(plannedCount[tp.id] || 0, ed);
    const aDays = m.ts.courseDone || m.completed ? ed : Math.min(m.credits, ed);
    plannedTotal += pDays; actualTotal += aDays;
    if (pDays > 0 || aDays > 0) rows.push({ tid: tp.id, planned: Math.round(pDays / ed * 100), actual: Math.round(aDays / ed * 100), mastery: m.mastery });
  }
  const behind = r1(plannedTotal - actualTotal);
  const tone = behind <= 1 ? 'green' : behind <= 3 ? 'yellow' : 'red';
  const label = behind <= 1 ? 'On track' : behind <= 3 ? 'Slightly behind' : 'Significantly behind';
  return { behind, tone, label, rows, plannedTotal, actualTotal };
}

function catchUpOptions(h) {
  const t = today(), n = Math.ceil(h.behind);
  const cur = currentTopic();
  const rests = [];
  for (let d = t; d <= addDays(t, 45) && rests.length < 3; d = addDays(d, 1)) {
    const b = BASE_DAYS[d];
    if (b && b.type === 'rest') rests.push({ date: d, converted: !!S().overrides[d] });
  }
  return { n, finish: addDays(LAST_LEARNING_DAY, n), rests, topic: cur };
}

function currentTopic() {
  const t = today();
  const info = dayInfo(t);
  if (info.type === 'learn') return info.topicId;
  for (let d = t; d >= ROADMAP_START; d = addDays(d, -1)) { const i = dayInfo(d); if (i.type === 'learn') return i.topicId; }
  return 'python';
}
function nextLearnDay(from) { for (let d = addDays(from, 1), i = 0; i < 120; i++, d = addDays(d, 1)) { const x = dayInfo(d); if (x.type === 'learn') return x; } return null; }

/* =========================================================
   9. CAPABILITY CHECK SCHEDULER ("Am I actually learning?")
   ========================================================= */
function dueCheck() {
  const t = today(), info = dayInfo(t);
  const recent = (tid, days) => (S().checks[tid] || []).some(c => diffDays(c.date, t) < days);
  if (info.type === 'exam' || info.type === 'pre') return null;
  if (info.type === 'learn' && info.dayIdx && info.dayIdx >= Math.ceil(info.dayCount / 2) && !recent(info.topicId, 2))
    return { tid: info.topicId, reason: info.dayIdx === info.dayCount ? 'Last planned day of this topic.' : 'You are past the halfway point of this topic.' };
  for (const tp of TOPICS) {
    const m = topicMetrics(tp.id);
    if (m.course >= 80 && m.decision && m.decision !== 'Continue' && !recent(tp.id, 3)) return { tid: tp.id, reason: `Your last result was “${m.decision}”. Re-check after working on it.` };
    if (m.course >= 80 && !m.last) return { tid: tp.id, reason: 'Course completion is high but capability has never been checked.' };
  }

/* =========================================================
   10. PERSONAL LEARNING ADVISOR
   ========================================================= */
function revisionsDue(d = today()) { return S().revisions.filter(r => !r.done && r.due <= d).sort((a, b) => a.due.localeCompare(b.due)); }

  const daysToExam = nextExam ? diffDays(t, nextExam.start) : null;

  if (info.type === 'pre') {

    out.focus = ['Install Python and set up a virtual environment', 'Create one GitHub repo for all roadmap exercises', 'Decide your daily coding block (at least 90 minutes)'];

  }

  }

  else if (passive) out.rec = 'The last few days were mostly watching. Today, write code before you open any video.';

}

/* =========================================================
   11. PERIOD STATS + REVIEWS

    else if (m.course >= 80 && (m.understanding || 0) < 6) recs.push(`${tName(tid)} is marked done in hours, but understanding is ${r1(m.understanding || 0)}/10. Rewrite your notes from memory and retake the check.`);

  if (st.study > 2 * st.coding + 2) recs.push(`Study-to-coding ratio was ${r1(st.study / Math.max(st.coding, 0.5))}:1. Aim to flip it next week: code first, watch only when stuck.`);
  if (st.avgScore !== null && st.avgScore < 60) recs.push(`Average learning quality was ${st.avgScore}/100. The fastest gains are in coding without tutorials and logging what you built.`);
  const od = revisionsDue(we).length; if (od) recs.push(`Clear ${od} pending revision checkpoint${od > 1 ? 's' : ''} early in the week.`);
  const nextExam = EXAM_PERIODS.find(p => p.start > we && diffDays(we, p.start) <= 8);
  if (nextExam) recs.push(`Exams begin ${fmt(nextExam.start, { wd: true })}. Plan light consolidation, not new heavy topics.`);
  const h = health(); if (h.behind > 3) recs.push(`You are ${h.behind} days behind. Pick one catch-up option on the Roadmap page rather than cramming.`);
  if (st.project < 1 && st.expected >= 4) recs.push('No project hours this week. Book at least 2 hours to apply what you learned.');
  if (!recs.length) recs.push('Solid week. Keep the same balance and add one small build without notes.');

}

function overallCompletion(filter = () => true) {
  const ts = TOPICS.filter(filter); const tot = ts.reduce((a, t) => a + t.days, 0);
  const course = ts.reduce((a, t) => a + topicMetrics(t.id).course * t.days, 0) / tot;
  const mastery = ts.reduce((a, t) => a + topicMetrics(t.id).mastery * t.days, 0) / tot;
  return { course: Math.round(course), mastery: Math.round(mastery) };
}

function monthlyAnalysis(ym) {
  const [y, mo] = ym.split('-').map(Number);
  const from = `${ym}-01`, to = toISO(new Date(y, mo, 0));
  const st = periodStats(from, to);
  const started = TOPICS.map(t => topicMetrics(t.id)).filter(m => m.started);
  const a = { st, from, to, strong: [], weak: [], unused: [], needTime: [], lowValue: null, projects: null, slow: null, revise: null, verdict: '' };
  if (st.logged < 5) { a.verdict = 'Not enough logged data this month for an honest assessment. Log daily check-ins for at least a week, then come back.'; return a; }
  a.strong = started.filter(m => m.status === 'Strong').map(m => m.tid);
  a.weak = started.filter(m => ['Weak', 'Needs Revision'].includes(m.status) || m.mastery < 40).map(m => m.tid);
  a.unused = started.filter(m => m.course >= 70 && (m.projectUsage || 0) < 4).map(m => m.tid);
  const h = health();
  a.needTime = h.rows.filter(r => r.planned - r.actual >= 40).map(r => r.tid);
  const topicH = Object.values(st.byTopic).reduce((x, y) => x + y, 0);
  const medH = Object.entries(st.byTopic).filter(([id]) => TOPIC[id].rel === 'Medium').reduce((x, [, v]) => x + v, 0);
  a.lowValue = topicH > 0 && medH / topicH > 0.35 ? `${Math.round(medH / topicH * 100)}% of topic hours went to medium-relevance topics. Check whether that depth is needed now.` : 'Time is concentrated on high-relevance topics.';
  const workTot = st.study + st.coding + st.project + st.revision;
  a.projects = workTot > 0 && st.project / workTot < 0.15 ? `Only ${Math.round(st.project / workTot * 100)}% of your time went to projects. You need more projects to turn topics into evidence.` : 'Project time share is reasonable.';
  const avgU = avg(started.map(m => m.understanding || 0)) || 0;
  a.slow = h.behind <= 0 && avgU < 6.5 ? 'You are keeping pace but average understanding is below 6.5/10. Slow down.' : h.behind > 5 && (st.avgScore || 0) >= 70 ? 'Quality is good but the timeline is too tight. Extend the plan rather than cutting depth.' : 'Pace looks sustainable.';
  const od = revisionsDue().length;
  const lowRet = started.filter(m => m.retention !== null && m.retention < 6).map(m => tName(m.tid));
  a.revise = od || lowRet.length ? `${od} revision checkpoint${od === 1 ? '' : 's'} pending${lowRet.length ? `; weak retention in ${lowRet.join(', ')}` : ''}. Revise before adding more.` : 'Revision is up to date.';
  const gap = avg(started.map(m => m.course - m.mastery)) || 0;
  if (gap > 30) a.verdict = `The roadmap itself is fine, but you are completing topics about ${Math.round(gap)} points faster than you are gaining capability. Keep the roadmap, reduce the pace, and add building time.`;
  else if (h.behind > 5) a.verdict = `The content is still worth following, but the schedule is not matching reality (${h.behind} days behind). Re-plan using the catch-up options instead of skipping depth.`;
  else if ((st.avgScore || 0) >= 70 && gap <= 20) a.verdict = 'Yes. Completion and capability are moving together and quality is consistently good. Keep going.';
  else a.verdict = 'Mostly yes, with adjustments: prioritize the weak topics and project work listed below before pushing forward.';
  return a;
}

function stackedBars(groups, series, H = 210, W = 640) {
  const L = 30, B = 24, T = 8, ih = H - T - B;
  const max = Math.max(1, ...groups.map(g => g.values.reduce((a, b) => a + b, 0)));
  const step = max <= 10 ? 2 : max <= 25 ? 5 : max <= 60 ? 10 : 20;
  const top = Math.ceil(max / step) * step;
  const bw = (W - L) / groups.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top; v += step) { const y = T + ih * (1 - v / top); s += `<line class="grid-line" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  groups.forEach((g, i) => {
    let y = T + ih; const x = L + i * bw + bw * 0.22, w = bw * 0.56;
    g.values.forEach((v, j) => { if (!v) return; const hh = v / top * ih; y -= hh; s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(hh, 0.5)}" rx="2" style="fill:${series[j].color}"><title>${esc(g.label)}: ${series[j].name} ${r1(v)}h</title></rect>`; });
    s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(g.label)}</text>`;
  });
  return `<div class="chart">${s}</svg></div>${legend(series)}`;
}

function lineChart(points, H = 200, max = 100) {
  const W = 640, L = 30, B = 24, T = 10, ih = H - T - B, iw = W - L - 8;
  const x = i => L + (points.length === 1 ? iw / 2 : i / (points.length - 1) * iw);
  const y = v => T + ih * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= max; v += max / 4) s += `<line class="grid-line" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const ok = points.map((p, i) => [p, i]).filter(([p]) => p.value !== null);
  if (ok.length > 1) s += `<polyline fill="none" style="stroke:var(--text)" stroke-width="1.8" stroke-linejoin="round" points="${ok.map(([p, i]) => `${x(i)},${y(p.value)}`).join(' ')}"/>`;
  ok.forEach(([p, i]) => { s += `<circle cx="${x(i)}" cy="${y(p.value)}" r="3.2" style="fill:var(--${pctTone(p.value)})"><title>${esc(p.label)}: ${p.value}</title></circle>`; });
  const every = Math.ceil(points.length / 8);
  points.forEach((p, i) => { if (i % every === 0 || i === points.length - 1) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`; });
  if (!ok.length) s += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No scored days in this range yet</text>`;
  return `<div class="chart">${s}</svg></div>`;
}

function weekGroups(n) {

function pipelineData() {

  return [

    { nm: 'Practicing', v: a(m => m.practical === null ? null : m.practical * 10) },

function pipelineVerdict(p) {

}

    const stDot = { completed: 'green', partial: 'yellow', missed: 'red', 'exam-logged': 'blue', 'rest-taken': 'muted' }[st];
    const stripe = info.type === 'learn' ? catTone(info.topicId) : TYPE_TONE[info.type];

    </div>`;
}

/* =========================================================
   17. SKILLS: matrix + portfolio value
   ========================================================= */
function missingFor(m) {
  const out = [], n = tName(m.tid);
  if (!m.started) return [`Not started yet. Planned for ${TOPIC[m.tid].days} day${TOPIC[m.tid].days > 1 ? 's' : ''}.`];
  if (!m.last) out.push('No capability check yet. Take one to measure real understanding.');
  if ((m.understanding || 0) < 7) out.push(`Explain the core concepts of ${n} from memory, then retake the concept check.`);
  if ((m.practical || 0) < 7) out.push(`Build something with ${n} without a tutorial (target ${effDays(m.tid) * (num(S().settings.codingTarget) || 2)}h of your own coding on it).`);
  if ((m.projectUsage || 0) < 5) out.push(m.projs.length ? `Use ${n} in ${m.projs[0].name}; its milestones are ${projectProgress(m.projs[0])}% done.` : `No project uses ${n} yet. Add it to a project's stack and build a feature with it.`);
  if (m.portfolio < 5) out.push(`Portfolio evidence is thin: a public repo, README and deployment that show ${n} in use.`);
  if (m.retention === null) out.push('Retention untested. Spaced revision starts once the course or topic is marked complete.');
  else if (m.retention < 6) out.push(`Retention is ${r1(m.retention)}/10. Revisit before it fades further.`);
  return out.length ? out : ['Nothing major missing. Keep revising on schedule.'];
}

  const listFor = tab === 'due' ? due : tab === 'up' ? up : done;
  const row = r => `<tr><td><span class="cat-stripe fill-${catTone(r.topicId)}"></span>${esc(tName(r.topicId))}</td><td>${r.interval === 'retry' ? 'Re-check' : r.interval + ' day' + (r.interval > 1 ? 's' : '') + ' later'}</td><td>${fmt(r.due, { wd: true })}${r.moved ? ' <span class="tiny muted">(moved past exams)</span>' : ''}${!r.done && r.due < t ? ' ' + chip('Overdue', 'yellow') : ''}</td><td>${r.done ? chip(`${r.score}%`, pctTone(r.score)) : ''}</td><td style="text-align:right">${r.done ? `<span class="tiny muted">${fmt(r.doneOn)}</span>` : `<button class="btn sm ${r.due <= t ? 'primary' : ''}" data-action="open-revision" data-id="${r.id}">${r.due <= t ? 'Start revision' : 'Revise early'}</button>`}</td></tr>`;

    <div class="grid g-main view-enter">
      <div class="card"><div class="row between mb"><div class="seg">${[['due', `Due (${due.length})`], ['up', `Upcoming (${up.length})`], ['done', `Completed (${done.length})`]].map(([v, l]) => `<button data-action="rev-tab" data-val="${v}" class="${tab === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>

/* =========================================================
   22. ANALYTICS
   ========================================================= */
function viewAnalytics() {
  const t = today();
  const pts = []; for (let i = 29; i >= 0; i--) { const d = addDays(t, -i), l = S().logs[d]; pts.push({ label: fmt(d), value: l && workHours(l) > 0 ? scoreLog(l).total : null }); }
  const started = TOPICS.map(x => topicMetrics(x.id)).filter(m => m.started);
  const all = periodStats(ROADMAP_START, t);
  const tot = all.study + all.coding + all.project + all.revision;
  const comp = {}; Object.keys(SCORE_MAX).forEach(k => comp[k] = []);
  Object.values(S().logs).forEach(l => { if (workHours(l) > 0) { const s = scoreLog(l); for (const k in comp) comp[k].push(s.parts[k] / SCORE_MAX[k] * 100); } });
  const weakest = Object.keys(comp).filter(k => comp[k].length).sort((a, b) => avg(comp[a]) - avg(comp[b]))[0];
  const rs = restStats();
  return `${pageHead('Analytics', 'Charts update from your check-ins. Hours are an input; capability is the output.')}
    <div class="stack view-enter">
      <div class="grid g-2">
        <div class="card"><h2>Weekly hours <span class="sub">last 8 weeks</span></h2>${stackedBars(weekGroups(8), SERIES)}</div>
        <div class="card"><h2>Daily learning quality <span class="sub">last 30 days</span></h2>${lineChart(pts)}</div>
      </div>
      <div class="grid g-2">
        <div class="card"><h2>Course completion vs skill mastery</h2>${started.length ? started.map(m => `<div style="padding:5px 0"><div class="row between small"><span>${esc(tName(m.tid))}</span><span class="muted">${m.course}% course · <strong class="t-${pctTone(m.mastery)}">${m.mastery}% mastery</strong></span></div><div class="dual mt-s">${bar(m.course, 'blue', null, true)}${bar(m.mastery, pctTone(m.mastery), null, true)}</div></div>`).join('') : '<div class="empty small">Appears after your first topic check-in.</div>'}</div>
        <div class="stack">
          <div class="card"><h2>Where the time goes <span class="sub">since start</span></h2>${tot > 0 ? SERIES.slice(0, 4).map(s => `<div class="bar-row"><span class="nm">${s.name}</span><div class="bar"><i style="width:${all[s.key] / tot * 100}%;background:${s.color}"></i></div><span class="v">${r1(all[s.key])}h</span></div>`).join('') + `<p class="small" style="margin:10px 0 0">Coding-to-study ratio <strong>${r1(all.coding / Math.max(all.study, 0.1))}</strong>. ${all.coding >= all.study ? 'You write more than you watch.' : 'You watch more than you write.'} University: ${r1(all.university)}h (separate).</p>` : '<div class="empty small">No hours logged yet.</div>'}</div>
          <div class="card"><h2>Score components <span class="sub">average across days</span></h2>${weakest ? Object.keys(SCORE_MAX).map(k => `<div class="bar-row"><span class="nm">${SCORE_LABEL[k]}</span>${bar(avg(comp[k]) || 0, pctTone(avg(comp[k]) || 0))}<span class="v">${Math.round(avg(comp[k]) || 0)}%</span></div>`).join('') + `<p class="small" style="margin:10px 0 0">Weakest area: <strong>${SCORE_LABEL[weakest]}</strong>.</p>` : '<div class="empty small">No scored days yet.</div>'}</div>
          <div class="card"><h2>Consistency</h2><div class="kv"><div><div class="k">Days logged</div><div class="v">${all.logged}</div></div><div><div class="k">Consistent days</div><div class="v">${all.consistent}/${all.expected}</div></div><div><div class="k">Rest taken / planned</div><div class="v">${rs.taken}/${rs.planned}</div></div><div><div class="k">Longest streak</div><div class="v">${streaks().longest}</div></div></div></div>
        </div>
      </div>
    </div>`;
}

const NAV = [

const VIEWS = { dashboard: viewDashboard, roadmap: viewRoadmap, calendar: viewCalendar, checkin: viewCheckin, skills: viewSkills, projects: viewProjects, revision: viewRevision, weekly: viewWeekly, monthly: viewMonthly, analytics: viewAnalytics, settings: viewSettings };

function renderNav(route) {
  const dueN = revisionsDue().length;
  document.getElementById('nav').innerHTML = NAV.map(([g, items]) => `${g ? `<div class="nav-group">${g}</div>` : '<div style="height:10px"></div>'}${items.map(([id, label]) => `<a href="#${id}" class="${route === id ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</svg>${label}${id === 'revision' && dueN ? `<span class="chip bg-blue" style="margin-left:auto;padding:0 7px">${dueN}</span>` : ''}</a>`).join('')}`).join('');
  const t = today(), info = dayInfo(t);
  document.getElementById('sideFoot').innerHTML = `${fmt(t, { wd: true, year: true })}${S().settings.dateOverride ? ' (preview)' : ''}<br>${info.type === 'exam' ? '<span class="t-red">University exams</span>' : esc(TYPE_LABEL[info.type])}`;
}
let lastRoute = null;
function render() {
  clearMetricCache();
  document.documentElement.dataset.theme = S().settings.theme;
  const [route0, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  const route = VIEWS[route0] ? route0 : 'dashboard';
  const keep = route === lastRoute ? window.scrollY : 0;
  document.getElementById('main').innerHTML = VIEWS[route](arg);
  renderNav(route);
  document.getElementById('topTitle').textContent = (NAV.flatMap(g => g[1]).find(x => x[0] === route) || [])[1] || '';
  if (route === 'checkin') updateScorePreview();
  window.scrollTo(0, keep);
  lastRoute = route;
  closeMenu();
}
function save(msg) { Repo.commit(); if (msg) toast(msg); render(); }

function toast(msg, kind = '') {
  const box = document.getElementById('toasts'); const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg; box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
let modalOnClose = null;
function openModal(html, wide = false) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const f = bg.querySelector('button:not(.x), input, textarea'); if (f) f.focus({ preventScroll: true });
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }
function confirmModal(title, body, actionLabel, onYes) {
  openModal(`<div class="modal-head"><h2>${esc(title)}</h2><button class="x" data-action="close-modal">×</button></div><p class="muted">${esc(body)}</p><div class="row"><button class="btn primary" id="confirmYes">${esc(actionLabel)}</button><button class="btn" data-action="close-modal">Cancel</button></div>`);
  document.getElementById('confirmYes').onclick = () => { closeModal(); onYes(); };
}
function segValues(root) { const o = {}; root.querySelectorAll('.seg[data-name]').forEach(s => o[s.dataset.name] = s.dataset.value || ''); return o; }
function closeMenu() { document.getElementById('side').classList.remove('open'); const s = document.getElementById('scrim'); if (s) s.remove(); }

const ACTIONS = {
  'seg': el => { const seg = el.closest('.seg'); seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); seg.dataset.value = el.dataset.val; if (seg.closest('#checkinForm')) updateScorePreview(); },
  'close-modal': () => closeModal(),
  'close-modal-nav': () => closeModal(),
  'add-task': el => { const inp = document.getElementById('newTask'), v = inp.value.trim(); if (!v) return; (S().customTasks[el.dataset.date] = S().customTasks[el.dataset.date] || []).push(v); save('Task added'); },
  'open-check': el => openModal(checkModal(el.dataset.tid)),
  'save-check': () => {
    const root = document.getElementById('checkForm'), tid = root.dataset.tid, v = segValues(root);
    if (Object.values(v).some(x => !x)) { toast('Answer all four questions first.', 'warn'); return; }
    const decision = decide(v);
    (S().checks[tid] = S().checks[tid] || []).push({ date: today(), ...v, decision });
    Repo.commit(); clearMetricCache();
    const gate = completionGate(tid);
    root.querySelector('#checkResult').innerHTML = `<div class="card flat mt"><div class="row between"><strong>Result</strong>${chip(decision, DECISION_TONE[decision])}</div><p class="small" style="margin:8px 0 0">${esc(DECISION_TEXT[decision])}</p>${gate.ok ? '<p class="small t-green" style="margin:6px 0 0">You can now mark this topic as mastered on the Skills page.</p>' : ''}</div>`;
    root.querySelector('[data-action="save-check"]').outerHTML = `<button class="btn primary" data-action="close-modal">Done</button>`;
    render();
  },
  'save-checkin': el => {
    const d = el.dataset.date, log = readCheckinForm(d);
    if (workHours(log) + num(log.university) + num(log.rest) === 0 && !log.learned && !log.built) { toast('Add hours or notes before saving.', 'warn'); return; }
    S().logs[d] = log;
    const sc = scoreLog(log), info = dayInfo(d);
    save(info.type === 'exam' && workHours(log) === 0 ? 'Saved. University study logged.' : `Saved. Learning quality ${sc.total}/100.`);
  },
  'delete-log': el => confirmModal('Delete this check-in?', `The log for ${fmt(el.dataset.date, { year: true })} will be removed.`, 'Delete check-in', () => { delete S().logs[el.dataset.date]; save('Check-in deleted'); }),
  'use-rest': el => { const d = el.dataset.date; if (isExam(d)) return; const cur = currentTopic(); const nx = dayInfo(d); S().overrides[d] = { type: 'learn', topicId: cur }; closeModal(); save(`${fmt(d)} is now a study day for ${tName(cur)}.`); },
  'restore-rest': el => { delete S().overrides[el.dataset.date]; closeModal(); save(`${fmt(el.dataset.date)} is a rest day again.`); },
  'toggle-essentials': el => { const ts = S().topicState[el.dataset.tid] = S().topicState[el.dataset.tid] || {}; ts.essentials = !ts.essentials; save(ts.essentials ? 'Essentials mode on' : 'Full topic restored'); },
  'goto-skill': el => { UI.skillSel = el.dataset.tid; location.hash = 'skills'; },
  'sel-skill': el => { UI.skillSel = el.dataset.tid; render(); const d = document.getElementById('skillDetail'); if (d && window.innerWidth < 960) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  'skill-filter': el => { UI.skillFilter = el.dataset.val; render(); },
  'course-done': el => {
    const tid = el.dataset.tid, ts = S().topicState[tid] = S().topicState[tid] || {};
    ts.courseDone = !ts.courseDone;
    if (ts.courseDone) scheduleRevisions(tid, today());
    save(ts.courseDone ? 'Course marked completed. That is course completion, not mastery. Revision checkpoints created.' : 'Course completion reset');
  },
  'complete-topic': el => {
    const tid = el.dataset.tid, ts = S().topicState[tid] = S().topicState[tid] || {};
    if (ts.completedOn) { delete ts.completedOn; save('Topic reopened'); return; }
    const g = completionGate(tid); if (!g.ok) { toast(g.why.join(' '), 'warn'); return; }
    ts.completedOn = today(); ts.courseDone = true; scheduleRevisions(tid, today());
    save(`${tName(tid)} marked mastered. Revision checkpoints scheduled.`);
  },
  'open-revision': el => openModal(revisionModal(el.dataset.id)),
  'save-revision': () => {
    const root = document.getElementById('revForm'), r = S().revisions.find(x => x.id === root.dataset.id), v = segValues(root);
    if (Object.values(v).some(x => !x)) { toast('Rate all four items first.', 'warn'); return; }
    const val = { yes: 1, partly: 0.5, no: 0 };
    r.result = { ...v, notes: root.querySelector('[name=notes]').value }; r.score = Math.round(avg(Object.values(v).map(x => val[x])) * 100);
    r.done = true; r.doneOn = today();
    if (r.score < 50) { let due = addDays(today(), 2); while (isExam(due)) due = addDays(due, 1); S().revisions.push({ id: `${r.topicId}-retry-${Date.now()}`, topicId: r.topicId, interval: 'retry', due, done: false }); }
    closeModal(); save(r.score < 50 ? `Retention ${r.score}%. A re-check is scheduled in 2 days.` : `Retention ${r.score}%. Saved.`);
  },
  'rev-tab': el => { UI.revTab = el.dataset.val; render(); },
  'open-day': el => openModal(dayModal(el.dataset.date)),
  'cal-prev': () => { const [y, m] = UI.calMonth.split('-').map(Number); UI.calMonth = toISO(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  'cal-next': () => { const [y, m] = UI.calMonth.split('-').map(Number); UI.calMonth = toISO(new Date(y, m, 1)).slice(0, 7); render(); },
  'cal-today': () => { UI.calMonth = today().slice(0, 7); render(); },
  'week-prev': () => { UI.week = addDays(UI.week, -7); render(); },
  'week-next': () => { UI.week = addDays(UI.week, 7); render(); },
  'week-now': () => { UI.week = weekStart(today()); render(); },
  'save-week': () => { const root = document.getElementById('weekForm'), o = {}; root.querySelectorAll('textarea').forEach(t => o[t.name] = t.value); S().weekly[root.dataset.ws] = o; save('Weekly review saved'); },
  'month-prev': () => { const [y, m] = UI.month.split('-').map(Number); UI.month = toISO(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  'month-next': () => { const [y, m] = UI.month.split('-').map(Number); UI.month = toISO(new Date(y, m, 1)).slice(0, 7); render(); },
  'save-month': () => { S().monthly[UI.month] = document.getElementById('monthNotes').value; save('Monthly notes saved'); },
  'new-project': () => openModal(projectForm(null), true),
  'edit-project': el => openModal(projectForm(S().projects.find(p => p.id === el.dataset.id)), true),
  'save-project': () => {
    const root = document.getElementById('projForm'), id = root.dataset.id, g = n => root.querySelector(`[name=${n}]`).value.trim();
    if (!g('name')) { toast('Give the project a name.', 'warn'); return; }
    const stack = [...root.querySelectorAll('[name=stack]:checked')].map(x => x.value);
    const names = g('milestones').split('\n').map(x => x.trim()).filter(Boolean);
    let p = S().projects.find(x => x.id === id);
    const prevDone = p ? Object.fromEntries(p.milestones.map(m => [m.name, m.done])) : {};
    const data = { name: g('name'), goal: g('goal'), target: g('target'), stack, extra: g('extra').split(',').map(x => x.trim()).filter(Boolean), milestones: names.map(n => ({ name: n, done: !!prevDone[n] })) };
    if (p) Object.assign(p, data); else S().projects.push({ id: 'p' + Date.now(), repo: '', demo: '', readme: false, deployed: false, ...data });
    closeModal(); save(p ? 'Project saved' : 'Project added');
  },
  'delete-project': el => { const p = S().projects.find(x => x.id === el.dataset.id); confirmModal('Delete project?', `“${p.name}” and its milestones will be removed.`, 'Delete project', () => { S().projects = S().projects.filter(x => x !== p); save('Project deleted'); }); },
  'set-theme': el => { S().settings.theme = el.dataset.val; save(); },
  'clear-override': () => { S().settings.dateOverride = ''; UI.checkinDate = null; UI.week = null; save('Using the real date'); },
  'export': async () => {
    const json = JSON.stringify(S(), null, 2), filename = `learning-roadmap-${today()}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename, data: new Blob([json], { type: 'application/json' }) }); toast('Export saved'); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
    if (!window.claude) { // standalone hosting (e.g. Vercel): normal browser download
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Export downloaded'); return;
    }
    openModal(`<div class="modal-head"><h2>Export data</h2><button class="x" data-action="close-modal">×</button></div><p class="small muted">Copy this JSON and keep it somewhere safe. You can paste it into a .json file and import it later.</p><textarea class="in" style="min-height:260px;font-size:12px" readonly>${esc(json)}</textarea><div class="row mt"><button class="btn primary" id="copyJson">Copy to clipboard</button></div>`, true);
    document.getElementById('copyJson').onclick = async () => { try { await navigator.clipboard.writeText(json); toast('Copied'); } catch (e) { document.querySelector('#modal textarea').select(); toast('Select all and copy manually.', 'warn'); } };
  },
  'reset': () => confirmModal('Reset all data?', 'Every check-in, check, revision, project change and review will be erased from this browser. Export first if you want a backup.', 'Reset all data', () => { Repo.reset(); UI.checkinDate = null; render(); toast('All data reset'); }),
  'menu': () => { const side = document.getElementById('side'); side.classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim'; s.onclick = closeMenu; document.body.appendChild(s); },
};
const CHANGES = {
  'toggle-task': el => { const d = el.dataset.date, task = el.dataset.task; const o = S().taskChecks[d] = S().taskChecks[d] || {}; if (el.checked) o[task] = true; else delete o[task]; save(); },
  'checkin-date': el => { if (el.value) location.hash = 'checkin/' + el.value; },
  'proj-field': el => { const p = S().projects.find(x => x.id === el.dataset.id); p[el.dataset.field] = el.value.trim(); save(); },
  'proj-bool': el => { const p = S().projects.find(x => x.id === el.dataset.id); p[el.dataset.field] = el.checked; save(); },
  'ms-toggle': el => { const p = S().projects.find(x => x.id === el.dataset.id); p.milestones[+el.dataset.i].done = el.checked; save(); },
  'chip-toggle': el => { const lab = el.closest('label'); lab.className = `chip ${el.checked ? 'bg-' + el.dataset.tone : 'bg-muted'}`; },
  'set-target': el => { S().settings.codingTarget = clamp(num(el.value) || 2, 0.5, 8); save('Coding target updated'); },
  'set-override': el => { S().settings.dateOverride = el.value; UI.checkinDate = null; UI.week = null; UI.calMonth = null; UI.month = null; save(el.value ? `Previewing ${fmt(el.value, { year: true })}` : ''); },
  'import': el => {
    const f = el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || typeof data !== 'object' || !data.logs || !data.settings) throw new Error('shape');
        Repo.state = Object.assign(defaultState(), data); save('Data imported');
      } catch (e) { toast('That file is not a valid export from this tracker.', 'warn'); }
    };
    rd.readAsText(f);
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.action === 'close-modal-nav') { closeModal(); return; }
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e); });
document.addEventListener('input', e => {
  if (e.target.type === 'range') { const o = e.target.parentElement.querySelector('output'); if (o) o.textContent = e.target.value; }
  if (e.target.closest('#checkinForm')) updateScorePreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeMenu(); }
  if (e.key === 'Enter' && e.target.id === 'newTask') { const b = document.querySelector('[data-action="add-task"]'); if (b) b.click(); }
});
window.addEventListener('hashchange', render);

Repo.init();
render();
</script></body></html>
